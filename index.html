<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JuanFi Multi-Vendo Monitor</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 20px; }
    h1 { color: #38bdf8; margin-bottom: 20px; }
    .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; width: 220px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .status-badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-weight: bold; margin-top: 10px; }
    .online { background: #22c55e; color: #fff; }
    .offline { background: #ef4444; color: #fff; }
    .ip-text { font-size: 0.85em; color: #94a3b8; margin-top: 8px; }
  </style>
</head>
<body>

  <h1>📡 JuanFi Multi-Vendo Monitor</h1>
  <div class="grid" id="vendo-container">Loading vendos...</div>

  <script>
    // Replace with your Vercel/Render API endpoint
    const API_URL = "juanfi-monitor-gesx8hgu0-primeaxis1.vercel.app/";

    async function fetchStatus() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        const container = document.getElementById("vendo-container");
        container.innerHTML = "";

        Object.keys(data).forEach(vendo => {
          const item = data[vendo];
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <h3>${item.name}</h3>
            <div class="ip-text">IP: ${item.ip}</div>
            <div class="status-badge ${item.status === 'ONLINE' ? 'online' : 'offline'}">
              ${item.status}
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error("Error fetching status:", err);
      }
    }

    fetchStatus();
    setInterval(fetchStatus, 30000); // Auto-refresh every 30 seconds
  </script>
</body>
</html>
